name: Validate Build, Types, Lint and Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install from lockfile
        run: corepack yarn@1.22.22 install --frozen-lockfile
      - name: Convert part data
        run: corepack yarn@1.22.22 convert-raw-data
      - name: Build
        run: corepack yarn@1.22.22 build
      - name: Check types
        run: corepack yarn@1.22.22 typecheck
      - name: Lint
        run: corepack yarn@1.22.22 lint --no-fix
      - name: Unit tests and coverage
        run: corepack yarn@1.22.22 test:unit
      - name: Add coverage report to Coveralls
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./tests/coverage/lcov.info
